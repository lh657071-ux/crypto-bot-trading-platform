version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-bot-backend
    ports:
      - "5000:5000"  # Expose port 5000 for public access
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - DATABASE_URL=postgresql://crypto_user:crypto_password@postgres:5432/crypto_bot
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=crypto_user
      - DB_PASSWORD=crypto_password
      - DB_NAME=crypto_bot
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crypto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend:/app/backend

  postgres:
    image: postgres:15-alpine
    container_name: crypto-bot-postgres
    environment:
      - POSTGRES_USER=crypto_user
      - POSTGRES_PASSWORD=crypto_password
      - POSTGRES_DB=crypto_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - crypto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_user -d crypto_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  crypto-network:
    driver: bridge
